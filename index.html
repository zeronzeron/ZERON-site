<!DOCTYPE html>
<!-- ══════════════════════════════════════════════════════════════
     ZERON — public front door (GitHub Pages)
     This PUBLIC repo (zeronzeron/ZERON, called ZERON-site until Oct 2026) holds ONLY this page, served by
     GitHub Pages (Settings ▸ Pages ▸ Deploy from a branch ▸ main / root).
     A copy is kept in site/index.html of zeronzeron/zeron-code, where the
     program itself lives; it runs
     as a Google Apps Script web app; this page shows it full-screen at
     https://zeronzeron.github.io/ZERON/

     ►► IF A NEW APPS SCRIPT DEPLOYMENT IS EVER MADE (new /exec URL),
        change the ONE line marked "APP URL" below. ◄◄
     ══════════════════════════════════════════════════════════════ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <title>ZERON — Zero Carbon Emissions Calculator</title>
  <meta name="description" content="Carbon emissions calculator for air travel, based on the ICAO Carbon Emissions Calculator Methodology.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2322c7e0'/%3E%3Ctext x='50' y='60' text-anchor='middle' font-family='Arial' font-weight='800' font-size='28' fill='%2304222a'%3EZ0%3C/text%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b1016; }
    iframe#app { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
    /* Loading screen: visible until the program arrives */
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
              background: #0b1016; color: #8a9aab; font-family: Inter, Roboto, Arial, Helvetica, sans-serif; font-size: 14px; transition: opacity .4s ease; text-align: center; padding: 16px; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .t1 { color: #5fdcef; font-weight: 800; font-size: 26px; letter-spacing: 4px; }
    #loader .t2 { color: #8a9aab; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; }
    .ring { width: 64px; height: 64px; border: 5px solid #1e2935; border-top-color: #22c7e0; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="ring"></div>
    <div class="t1">ZERON</div>
    <div class="t2">Zero Carbon · Emissions Calculator</div>
    <div id="msg">Loading…</div>
  </div>

  <!-- ▼▼▼ APP URL — the only line to change after a new deployment ▼▼▼ -->
  <iframe id="app" allow="clipboard-write"
    src="https://script.google.com/macros/s/AKfycbzPYZi0ptywYpauixQmbjkSOS78oUbbqjzho-mmTwsIN__9ndrqSiVDt1H6iUNJD58/exec"
    onload="document.getElementById('loader').classList.add('done')"></iframe>
  <!-- ▲▲▲ APP URL ▲▲▲ -->
  <script>
    /* Until the web app is deployed and its link pasted above, say so instead of showing an error page. */
    if (document.getElementById('app').src.indexOf('PASTE-') >= 0) {
      document.getElementById('app').remove();
      document.querySelector('#loader .ring').remove();
      document.getElementById('msg').textContent = 'ZERON is not connected yet: put the web app link (Deploy ▸ Manage deployments ▸ Web app URL) in index.html.';
    }
  </script>
</body>
</html>
